name: arke
description: 家档（Arke）— 家庭商品质保与售后档案管家
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态与路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # 本地数据库（PRD §7 数据模型）
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4

  # 偏好与安全
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # 国际化 / 格式化（PRD FR11：占位符具名、ICU 复数、数字/日期走 intl）
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true # 启用 flutter gen-l10n（l10n.yaml 配置）

  fonts:
    - family: IntelOneMono
      fonts:
        - asset: assets/fonts/IntelOneMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IntelOneMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IntelOneMono-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
    - assets/icons/
